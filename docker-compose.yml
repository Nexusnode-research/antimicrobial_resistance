services:
  amr:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8888:8888"
    volumes:
      - ./:/workspace
    command: >
      bash -lc "mkdir -p outputs/figures outputs/tables &&
                micromamba run -n base micromamba run -n base jupyter lab --NotebookApp.token='' --ip=0.0.0.0 --port=8888 --no-browser"
